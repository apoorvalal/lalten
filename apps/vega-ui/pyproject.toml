[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vega-ui"
version = "0.1.0"
description = "Stage A Vega-Lite presentation editor for Altair charts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "python-fasthtml>=0.13.2",
    "uvicorn[standard]>=0.43.0",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
vega-ui = "vega_ui.app:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["vega_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
